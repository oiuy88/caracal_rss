name: Monitor CIRCABC

on:

  schedule:
    # Every hour.
    - cron: "23 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-feed:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl CIRCABC and generate RSS
        run: |
          python scripts/circabc_rss.py

      - name: Validate RSS XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse("docs/feed.xml")

          print("RSS XML is valid.")
          PY

      - name: Commit updated feed and state
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/feed.xml \
            state/state.json

          # Include diagnostics if they exist.
          if [ -f state/last_response.html ]; then
            git add state/last_response.html
          fi

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit \
            -m "Update CIRCABC RSS feed"

          git push
